name: Logos das empresas

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'acoes separadas por espaco (ex.: TAEE11 RECV3); vazio = todas as acoes do ativos.json'
        default: ''
      forcar:
        description: '1 = baixa de novo mesmo se o logo ja existir'
        default: '0'

permissions:
  contents: write

jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixa os logos
        run: |
          T="${{ inputs.tickers }}"
          if [ -z "$T" ]; then
            T=$(python3 -c "import json;d=json.load(open('noticias/ativos.json'));print(' '.join(k for k,v in d.items() if isinstance(v,dict) and v.get('tipo')=='acao'))")
          fi
          if [ "${{ inputs.forcar }}" = "1" ]; then python3 noticias/logos.py --forcar $T; else python3 noticias/logos.py $T; fi
      - name: Salva no repositório
        run: |
          git config user.name "cotacoes-bot"
          git config user.email "cotacoes-bot@users.noreply.github.com"
          git add logos
          git diff --cached --quiet && exit 0
          git commit -q -m "Logos das empresas"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((i * 5)); done
          exit 1
