name: Noticias dos ativos
on:
  schedule:
    # 7h30 e 19h de Brasilia (10:30 e 22:00 UTC), todos os dias
    - cron: '30 10 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      turno:
        description: 'manha (com portais) ou noite (so oficiais)'
        default: 'manha'
      teste:
        description: '1 = so mostra, nao grava nem avisa'
        default: '0'
      janela:
        description: 'quantos dias para tras olhar'
        default: '3'
      reset:
        description: '1 = apaga as noticias e comeca do zero'
        default: '0'
      reprocessar:
        description: '1 = refaz so os itens de rendimento (sem portais)'
        default: '0'
      sem_aviso:
        description: '1 = nao manda aviso no Telegram nesta rodada'
        default: '0'
      cadastro_teste:
        description: 'so com teste=1: tickers separados por virgula para testar o cadastro automatico'
        default: ''
permissions:
  contents: write
  actions: read
concurrency:
  group: noticias
  cancel-in-progress: false
jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q anthropic firebase-admin
      - name: Busca noticias
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LIMITE_USD: ${{ vars.NOTICIAS_LIMITE_USD }}
          TURNO: ${{ inputs.turno }}
          TESTE: ${{ inputs.teste }}
          JANELA_DIAS: ${{ inputs.janela }}
          RESET: ${{ inputs.reset }}
          SEM_AVISO: ${{ inputs.sem_aviso }}
          REPROCESSAR_RENDIMENTOS: ${{ inputs.reprocessar }}
          CADASTRO_TESTE: ${{ inputs.cadastro_teste }}
        run: python3 noticias/robo.py
      - name: Logos de empresas novas
        if: hashFiles('logos_faltando.txt') != ''
        run: |
          python3 noticias/logos.py --arquivo logos_faltando.txt
          rm -f logos_faltando.txt
          git config user.name "cotacoes-bot"
          git config user.email "cotacoes-bot@users.noreply.github.com"
          git add logos
          git diff --cached --quiet && exit 0
          git commit -q -m "Logos de empresas novas"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((i * 5)); done
          exit 1
      - name: Avisa no Telegram se a rodada quebrou
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=⚠️ O robô de notícias parou com erro nesta rodada ($(TZ=America/Sao_Paulo date +'%d/%m %H:%M')). Mande esta mensagem para o Claude (no chat da carteira do Flávio) que ele resolve. Rodada: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null
