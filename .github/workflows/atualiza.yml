name: Atualiza cotacoes automaticas
on:
  schedule:
    # A cada 10 minutos, das 10h às 18h (Brasília), de segunda a sexta
    - cron: '*/10 13-21 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: cotacoes
  cancel-in-progress: false
jobs:
  atualiza:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Busca cotacoes
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
        run: python3 atualiza.py
      - name: Salva
        run: |
          git config user.name "cotacoes-bot"
          git config user.email "cotacoes-bot@users.noreply.github.com"
          git add cotacoes.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Cotacoes $(TZ=America/Sao_Paulo date +'%d/%m %H:%M')"
          # se outro robo gravou ao mesmo tempo, junta e tenta de novo
          for i in 1 2 3 4 5; do
            git push -q && exit 0
            sleep $((i * 5)); git pull -q --rebase -X theirs || git pull -q --rebase
          done
          exit 1
      - name: Avisa no Telegram quando falha duas vezes seguidas
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # uma falha isolada (site da B3 fora por alguns minutos) nao avisa; a segunda seguida avisa, uma vez so
          ANT=$(gh api "repos/${{ github.repository }}/actions/workflows/atualiza.yml/runs?status=completed&per_page=2" --jq '[.workflow_runs[].conclusion] | join(",")' || echo "success,success")
          if [ "${ANT%%,*}" = "failure" ] && [ "${ANT#*,}" != "failure" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
              --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
              --data-urlencode "text=⚠️ O robô de cotações automáticas falhou duas vezes seguidas ($(TZ=America/Sao_Paulo date +'%d/%m %H:%M')). Mande esta mensagem para o Claude (no chat da carteira do Flávio) que ele resolve. Rodada: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null
          fi
